<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        div.clip {
            background: url(../src/imgs/pittsburgh.jpg) no-repeat center;
            background-size: cover;
            height: 280px;
            margin-block: 1rem;
            margin-inline: auto;
            transition: all 0.4s ease-in;
            width: 320px;
        }
        div.clip1 {
            clip-path: polygon(50% 0%, 100% 0, 100% 57%, 100% 80%, 100% 100%, 49% 100%, 0 100%, 0 75%, 0 57%, 0 0);
        }
        div.clip2 {
            clip-path: polygon(50% 0%, 100% 0, 100% 57%, 100% 80%, 100% 100%, 49% 100%, 0 100%, 0 75%, 0 57%, 0 0);
        }
        div.clip1:hover {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
        div.clip2:hover {
            clip-path: polygon(20% 0%, 0% 20%, 0 50%, 0% 80%, 20% 100%, 49% 100%, 80% 100%, 100% 80%, 100% 50%, 100% 20%, 80% 0%, 50% 0);
        }
    </style>
</head>
