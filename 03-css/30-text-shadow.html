<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            p.txt{
            text-align: center;
            font-size: 3.6rem;
        
        &.txt1{
            text-shadow: 0px 0px 36px rgb(197, 21, 197);
            }
            &.txt2{
            text-shadow: -8px -8px 8px rgb(71, 70, 70);
            }
            &.txt3{
                 text-shadow:     0 1px 0 hsl(174,5%,80%),
	                 0 2px 0 hsl(174,5%,75%),
	                 0 3px 0 hsl(174,5%,70%),
	                 0 4px 0 hsl(174,5%,66%),
	                 0 5px 0 hsl(174,5%,64%),
	                 0 6px 0 hsl(174,5%,62%),
	                 0 7px 0 hsl(174,5%,61%),
	                 0 8px 0 hsl(174,5%,60%),
	
	                 0 0 5px rgba(0,0,0,.05),
	                0 1px 3px rgba(0,0,0,.2),
	                0 3px 5px rgba(0,0,0,.2),
	               0 5px 10px rgba(0,0,0,.2),
	              0 10px 10px rgba(0,0,0,.2),
	              0 20px 20px rgba(0,0,0,.3);
                }
                &.txt4{
                 text-shadow: -5px 15px 15px rgb(4, 102, 4),

	                 0 2px 0 green,
	                 0 3px 0 green,
	                 0 4px 0 green,
	                 0 5px 0 green,
	                 0 6px 0 green,
	                 0px 7px 0 green,
	                 0px 8px 0 green,
	
	                 0 0 5px yellow,
	                0 1px 3px yellow,
	                0 3px 5px yellow,
	               0 5px 10px yellow,
	              0 10px 10px yellow,
	              10px 20px 20px yellow;
                }
            }
        }

    </style>
</head>
<body class="css">

        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>30-text-shadow</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Description</h3>
        </header>
       <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
