<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29-new-background</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
        div.multiples {
            background: url(../src/imgs/bg3.png),
                        url(../src/imgs/bg2.png),
                        url(../src/imgs/bg1.png);     
            border-radius: 0.4rem;
            outline: 4px solid #fff9;
            margin: 1rem auto;
            height: 453px;
            width: 320px;     
                }
                div {
                    border-radius: 0.4rem;
                    outline: 4px solid #fff9;
                    height: 200px;
                    margin: 1rem auto;
                    width: 360px;
                    &.gradient1 {
                        background: linear-gradient(red, yellow,);
                    }
                    &.gradient2 {
                        background: linear-gradient(45deg, black, white,black);
                    }
                    &.gradient3 {
                        background: linear-gradient(#ffcd00 , 50%, #003087 50%, #003087 75%, #c8102e 75% );
                    }
                    &.gradient4 {
                        background: linear-gradient(to right , white 50%, black 50%);
                    background-size: 20px;
                    }
                    &.gradient5 {
                        background: radial-gradient(circle, red , blue);
                    }
                    &.gradient6 {
                        background: radial-gradient(circle, yellow  15%, red 20%,red, 30%,blue 35%,
                        blue 40%, black 45%,black 50%,white, white 60%);
                    }
                    &.gradient7 {
                        background: conic-gradient(red, blue, white);
                    }
                    &.mask {
                        background: linear-gradient(to right, green 40%, white 40%, red 40%);
                        mask-image: url(../src/imgs/mask.svg);
                        mask-size: 100% 100%;
                    }
                }
                h4 {
                    font-size: 8rem;
                    text-align: center;
                    margin: 0;
                    &.clip1 {
                    background: linear-gradient(to right ,black,red,white,black,white,red,black);
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                    }
                    &.clip2 {
                    background: url(../src/imgs/bgfire.jpg);
                    background-clip: text;
                    font-size: 10rem;
                    text-transform: uppercase;
                    -webkit-text-fill-color: transparent;
                    }
                }
            }
         
    </style>
</head>
<body class="css">
    <nav class="back">

        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>29 29-new-background</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Description</h3>
        </header>
           <section>
            <h2 class="subtitle">Bgs Multiples:</h2>
            <div class="multiples"></div>
            <h2 class="subtitle">Bgs Gradients:</h2>
            <h5>linear-gradient(to direction, color1, color2)</h5>
            <div class="gradient1"></div>
            <h5>linear-gradient(degrees, color1, color2)</h5>
            <div class="gradient2"></div>
            <h5>Colombia Flag</h5>
            <div class="gradient3"></div>
            <h5>Vertical Lines</h5>
            <div class="gradient4"></div>
            <h5>radial-gradient(shape, color1, color2)</h5>
            <div class="gradient5"></div>
            <h5>BullsEye</h5>
            <div class="gradient6"></div>
            <h5>conic-gradient(color1, color2)</h5>
            <div class="gradient7"></div>
            <h2 class="subtitle">Bgs Clip:</h2>
            <h4 class="clip1">ADSO</h4>
            <h4 class="clip2">fire</h4>
            <h2 class="subtitle">Bg Mask:</h2>
            <div class="mask"></div>
</section>
    </main>
</body>
