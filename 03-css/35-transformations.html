<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-transformations</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
        img {
            display: block;
            margin: 2rem auto;

            &.transform1 {
                transform: rotate(0.25turn); /*90deg*/
            }
            &.transform2 {
                transform: scale(.5); 
            }
            &.transform3 {
                transform: TranslateX(-100px); 
            }
            &.transform4 {
                transform: Skew(30deg); 
            }
            &.transform5 {
                transform: rotate(45deg) scale(1.4); 
            }
        }
    }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">

        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>35-transformations</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Description</h3>
        </header>
        <section>
            <h2 class="subtitle">Rotate: 90deg</h2>
            <img class="transform1" src="/src/imgs/mario.png" width="180px">
            <h2 class="subtitle">Scale: 0.5</h2>
            <img class="transform2" src="/src/imgs/mario.png" width="180px">
            <h2 class="subtitle">TranslateX: -100px</h2>
            <img class="transform3" src="/src/imgs/mario.png" width="180px">
            <h2 class="subtitle">Skew: 30deg</h2>
            <img class="transform4" src="/src/imgs/mario.png" width="180px">
            <h2 class="subtitle">Rotate Scale:</h2>
            <img class="transform5" src="/src/imgs/mario.png" width="180px">
        </section>
    </main>
</body>
</html>
