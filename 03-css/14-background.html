    <style>
        section {
            div {
                border: 2px solid #fff;
                height: 400px;
                margin: 1rem auto;
                width: 360px;
                &.bg01 {
                    background-color: #ab7dd5;
                }
                &.bg02 {
                    background-image: url(../src/imgs/mario.png);
                    background-size: 25%;
                }
                &.bg03 {
                    background-image: url(../src/imgs/mario.png);
                    background-size: 50%;
                    background-repeat: repeat-x;
                }
                &.bg04{
                    background-image: url(../src/imgs/mario.png);
                    background-size: 100%;
                    background-repeat: no-repeat;
                    background-position: center;
                }
                &.bg05{
                    background-image: url(../src/imgs/mario.png);
                    background-size: cover;
                    background-repeat: no-repeat;
                    background-position: center;
                }
                &.bg06{
                    background-image: url(../src/imgs/mario.png);
                    background-size: 100%;
                    background-repeat: no-repeat;
                    background-position: center;
                    background-attachment: fixed;
                }
            }
        }
    </style>
</head>
