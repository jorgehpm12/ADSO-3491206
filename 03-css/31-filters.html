<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
            img.filter{
                display: block;
                width: 160px;
                margin: 1rem auto;
                transition: all 0.4s ease-in;

                &.filter1{
                    filter: grayscale(1);
                }

                &.filter2{
                    filter: blur(100px);
                }
                 &.filter3{
                    filter: sepia(1);
                }
                 &.filter4{
                    filter: Brightness(.2);
                }
                 &.filter5{
                    filter: Invert(1);
                 }
                 &.filter6{
                    filter: drop-shadow(20px);
                 }
                 &.filter7{
                    filter: hue-rotate(120deg);
                }
                &:hover{
                    filter: none;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#currentColor" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>31-filters</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Description</h3>
        </header>
        <section>
            <h2 class="subtitle">GrayScale</h2>
            <img class="filter filter1" src="../src/imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Blur</h2>
            <img class="filter filter2" src="../src/imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Sepia</h2>
            <img class="filter filter3" src="../src/imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Brightness</h2>
            <img class="filter filter4" src="../src/imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Invert</h2>
            <img class="filter filter5" src="../src/imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">drop-shadow</h2>
            <img class="filter filter6" src="../src/imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">hue-rotate</h2>
            <img class="filter filter7" src="../src/imgs/inosuke.png" alt="Inosuke">

        </section>
    </main>
</body>
