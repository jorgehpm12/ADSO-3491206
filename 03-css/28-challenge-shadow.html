    <title>28-challenge-shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        figure.frame {
            background-color: white;
            height: calc(23* 20px); /*y; 29*/
            width: calc(23* 20px); /*y; 29*/
            margin: 2rem auto;
            zoom: 0.60;
            transition: all 0.4s ease-in;
            &:hover {
                transform: scale (1.4);
            }
        }
        div.square {
            background: url(../src/imgs/square.png);
            opacity: 0.4;
            z-index: 2;
            margin-top: -20px;
            height: calc(23 * 20px);
        }
        div.ash {
            background-color: transparent;
            height: 20px;
            width: 20px;
            box-shadow: 20px 0 0 0 black,
                        40px 0 0 0 black,
                        60px 0 0 0 black,
                        80px 0 0 0 black,
                        100px 0 0 0 black,
                        120px 0 0 0 black,
                        140px 0 0 0 black,
                        160px 0 0 0 black,
                        180px 0  0 black,
                        200px 0 0 0 black,
                        20px 220px 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black,
                        20px 0 0 0 black;
}
        
    </style>
