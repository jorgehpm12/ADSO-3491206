<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-transitions</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            img {
                display: block;
                margin: 1rem auto;

                &.transition01 {
                    transition: transform 0.5s ease-in;

                    &:hover {
                        transform: scale(1.3);
                    }
                }
                &.transition02 {
                    transition: all 1s linear;

                    &:hover {
                        transform: rotate(-0.5turn);
                    }
                }
                &.transition03 {
                    transition: all 1s linear;

                    &:hover {
                        transform: rotateY(0.5turn);
                        
            }
        }
                   &.transition04 {
                      transition: transform 0.2s ease;

                    &:hover {
                        transform: TranslateX(80px);
                        
            }
        }
    }
    div.box {
        background-color: red;
        margin-bottom: 2rem;
        height: 100px;
        width: 100px;
        transition: width 0.5s ease,
                    height 0.5s 0.5s ease-in,
                    background 1s 1s ease-in,
                    transform 0.5s 2s linear;
        
        &:hover {
            background: yellow;
            height: 200px;
            transform: rotate(360deg);
            width: 380px;
        }
    }
}
    </style>
</head>
<body class="css">
    <nav class="back">

        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>36-transitions</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Description</h3>
        </header>
       <section>
            <h2 class="subtitle">Scale(1.3):</h2>
            <img class="transition01" src="../src/imgs/dk.png" alt="DK">
            <h2 class="subtitle">Rotate(-0.5turn):</h2>
            <img class="transition02" src="../src/imgs/dk.png" alt="DK">
            <h2 class="subtitle">RotateY(180deg):</h2>
            <img class="transition03" src="../src/imgs/dk.png" alt="DK">
            <h2 class="subtitle">TranslateX(80px):</h2>
            <img class="transition04" src="../src/imgs/dk.png" alt="DK">
            <h2 class="subtitle">Multiple:</h2>
            <div class="box"></div>
</section>
    </main>

</html>
